<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* =========================================================
       MEDCORE — PAINEL MÉDICO
       ESTILOS EXCLUSIVOS DESTA PÁGINA
    ========================================================= */

    .medico-page {
      min-height: 100vh;
      height: auto;
      overflow-y: auto;

      background: linear-gradient(
        135deg,
        #f4f8fb 0%,
        #eef6f9 50%,
        #f8fafc 100%
      );

      color: #1e293b;
    }

    .medico-page .container {
      width: calc(100% - 50px);
      max-width: 1350px;
      margin: 0 auto;
      padding: 30px 0 50px;
    }

    /* CABEÇALHO */

    .medico-page .cabecalho-medico {
      display: flex;
      justify-content: space-between;
      align-items: center;

      background: white;
      padding: 20px 25px;

      border-radius: 16px;
      border: 1px solid #e2e8f0;

      box-shadow:
        0 6px 20px rgba(15, 23, 42, 0.06);

      margin-bottom: 20px;
    }

    .medico-page .cabecalho-medico h2 {
      margin: 0;
      color: #123b59;
      font-size: 25px;
      font-weight: 800;
    }

    .medico-page .btn-abrir-tv {
      background: linear-gradient(135deg, #159bc5, #126a94);
      border: none;
      padding: 11px 18px;
      border-radius: 10px;

      color: white;
      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 5px 14px rgba(18, 106, 148, 0.22);

      transition: 0.2s;
    }

    .medico-page .btn-abrir-tv:hover {
      transform: translateY(-2px);

      box-shadow:
        0 8px 20px rgba(18, 106, 148, 0.3);
    }


    /* CONSULTÓRIO */

    .medico-page .consultorio-input {
      display: flex;
      align-items: center;
      gap: 15px;

      margin-bottom: 25px;
      padding: 16px 20px;

      background: white;
      border-radius: 14px;

      border: 1px solid #dbe5ec;

      box-shadow:
        0 4px 14px rgba(15, 23, 42, 0.05);
    }

    .medico-page .consultorio-input label {
      margin: 0;

      color: #123b59;
      font-size: 14px;
      font-weight: 700;
    }

    .medico-page .consultorio-input input {
      width: 70px;
      height: 42px;

      padding: 5px 10px;

      text-align: center;

      font-size: 17px;
      font-weight: 800;

      color: #126a94;

      background: #f5fafc;

      border: 1px solid #cbdde6;
      border-radius: 9px;

      outline: none;
    }

    .medico-page .consultorio-input input:focus {
      border-color: #159bc5;

      background: white;

      box-shadow:
        0 0 0 4px rgba(21, 155, 197, 0.1);
    }

    .medico-page .consultorio-input span {
      color: #64748b;
      font-size: 13px;
    }


    /* FILA */

    .medico-page #triagens {
      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(320px, 1fr));

      gap: 18px;
      margin-top: 10px;
    }


    /* CARD DO PACIENTE */

    .medico-page #triagens .card {
      position: relative;

      background: white;

      padding: 22px;

      border-radius: 16px;
      border: 1px solid #e2e8f0;

      box-shadow:
        0 6px 18px rgba(15, 23, 42, 0.07);

      transition:
        transform 0.2s,
        box-shadow 0.2s;

      overflow: hidden;
    }

    .medico-page #triagens .card::before {
      content: "";

      position: absolute;

      left: 0;
      top: 0;

      width: 5px;
      height: 100%;

      background:
        linear-gradient(180deg, #19a7ce, #126a94);
    }

    .medico-page #triagens .card:hover {
      transform: translateY(-3px);

      box-shadow:
        0 12px 28px rgba(15, 23, 42, 0.1);
    }

    .medico-page #triagens .card h3 {
      margin: 0 0 17px;

      color: #123b59;

      font-size: 20px;
      font-weight: 800;
    }

    .medico-page #triagens .card p {
      margin: 9px 0;

      color: #475569;

      font-size: 14px;
      line-height: 1.45;
    }

    .medico-page #triagens .card p b {
      color: #334155;
    }


    /* CLASSIFICAÇÃO DE RISCO */

    .medico-page #triagens .card .vermelho,
    .medico-page #triagens .card .amarelo,
    .medico-page #triagens .card .verde,
    .medico-page #triagens .card .azul {
      display: inline-flex;

      padding: 5px 11px;

      border-radius: 20px;

      font-size: 12px;
      font-weight: 800;

      text-transform: uppercase;
    }

    .medico-page #triagens .card .vermelho {
      background: #fee2e2;
      color: #b91c1c;
    }

    .medico-page #triagens .card .amarelo {
      background: #fef3c7;
      color: #b45309;
    }

    .medico-page #triagens .card .verde {
      background: #dcfce7;
      color: #15803d;
    }

    .medico-page #triagens .card .azul {
      background: #dbeafe;
      color: #1d4ed8;
    }


    /* BOTÕES DO CARD */

    .medico-page .acoes-paciente {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;

      margin-top: 18px;
      padding-top: 15px;

      border-top: 1px solid #edf2f7;
    }

    .medico-page .btn-atender {
      background:
        linear-gradient(135deg, #159bc5, #126a94);

      color: white;

      border: none;

      padding: 10px 16px;

      border-radius: 9px;

      cursor: pointer;

      font-size: 13px;
      font-weight: 700;

      transition: 0.2s;
    }

    .medico-page .btn-atender:hover {
      transform: translateY(-2px);
    }

    .medico-page .btn-tv {
      background:
        linear-gradient(135deg, #16a34a, #15803d);

      color: white;

      border: none;

      padding: 10px 16px;

      border-radius: 9px;

      cursor: pointer;

      font-size: 13px;
      font-weight: 700;

      transition: 0.2s;
    }

    .medico-page .btn-tv:hover {
      transform: translateY(-2px);
    }


    /* SEPARADOR */

    .medico-page hr {
      border: none;

      height: 1px;

      background: #dbe5ec;

      margin: 30px 0;
    }


    /* ÁREA DA CONSULTA */

    .medico-page .consulta {
      background: white;

      padding: 25px;

      border-radius: 16px;

      border: 1px solid #e2e8f0;

      box-shadow:
        0 6px 20px rgba(15, 23, 42, 0.06);
    }

    .medico-page .consulta h3 {
      margin-bottom: 20px;

      color: #123b59;

      font-size: 22px;
      font-weight: 800;
    }

    .medico-page .campos-consulta {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 12px;
    }

    .medico-page #paciente,
    .medico-page #diagnostico,
    .medico-page #medicacao,
    .medico-page #obs {
      height: 46px;

      padding: 0 14px;

      border: 1px solid #d6dee7;
      border-radius: 9px;

      background: white;

      color: #1e293b;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;

      outline: none;

      transition: 0.2s;
    }

    .medico-page #paciente:focus,
    .medico-page #diagnostico:focus,
    .medico-page #medicacao:focus,
    .medico-page #obs:focus {
      border-color: #159bc5;

      box-shadow:
        0 0 0 4px rgba(21, 155, 197, 0.1);
    }

    .medico-page #paciente {
      background: #f1f5f9;
      color: #64748b;
      cursor: not-allowed;
    }

    .medico-page #obs {
      width: 100%;

      height: 110px;
      min-height: 110px;

      margin-top: 14px;

      padding: 14px;

      resize: vertical;
    }


    /* BOTÕES CONSULTA */

    .medico-page .acoes-consulta {
      display: flex;

      gap: 12px;

      margin-top: 16px;

      flex-wrap: wrap;
    }

    .medico-page .btn-salvar {
      background:
        linear-gradient(135deg, #159bc5, #126a94);

      color: white;

      border: none;

      padding: 12px 20px;

      border-radius: 9px;

      cursor: pointer;

      font-size: 14px;
      font-weight: 700;

      transition: 0.2s;
    }

    .medico-page .btn-salvar:hover {
      transform: translateY(-2px);
    }


    /* RESPONSIVO */

    @media (max-width: 900px) {

      .medico-page .container {
        width: calc(100% - 30px);
      }

      .medico-page .campos-consulta {
        grid-template-columns: 1fr;
      }

    }

    @media (max-width: 600px) {

      .medico-page .container {
        width: calc(100% - 20px);
        padding-top: 15px;
      }

      .medico-page .cabecalho-medico {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      .medico-page .btn-abrir-tv {
        width: 100%;
      }

      .medico-page .consultorio-input {
        flex-wrap: wrap;
      }

      .medico-page .consultorio-input span {
        width: 100%;
      }

      .medico-page .acoes-consulta button {
        width: 100%;
      }

    }

  </style>
</head>

<body class="medico-page">

  <div class="container">

    <!-- CABEÇALHO -->
    <div class="cabecalho-medico">

      <h2>🩺 Painel Médico</h2>

      <button
        class="btn-abrir-tv"
        onclick="window.open('tv.html','_blank')">
        📺 Abrir Tela da TV
      </button>

    </div>


    <!-- CONSULTÓRIO -->
    <div class="consultorio-input">

      <label>Meu Consultório:</label>

      <input
        type="text"
        id="consultorio-num"
        value="01">

      <span>
        Este número será exibido na TV ao chamar o paciente.
      </span>

    </div>


    <!-- FILA DE PACIENTES -->
    <div id="triagens"></div>


    <hr>


    <!-- CONSULTA -->
    <div class="consulta">

      <h3>🩺 Consulta</h3>

      <div class="campos-consulta">

        <input
          id="paciente"
          placeholder="Paciente"
          readonly>

        <input
          id="diagnostico"
          placeholder="Diagnóstico">

        <select id="medicacao">

          <option value="">
            Selecione a medicação
          </option>

        </select>

      </div>


      <textarea
        id="obs"
        placeholder="Observações"></textarea>


      <!-- BOTÃO -->
      <div class="acoes-consulta">

        <button
          class="btn-salvar"
          onclick="salvar()">
          💾 Salvar Consulta
        </button>

      </div>

    </div>

  </div>


  <script>

    let triagensCarregadas = [];


    /* =========================================================
       CARREGAR PACIENTES
    ========================================================= */

    function carregar() {

      fetch("/triagens")

        .then(r => r.json())

        .then(data => {

          triagensCarregadas = data;

          const div = document.getElementById("triagens");

          div.innerHTML = "";


          if (data.length === 0) {

            div.innerHTML =
              "<p style='color:#888; text-align:center;'>Nenhum paciente na fila.</p>";

            return;
          }


          data.forEach((t, index) => {

            div.innerHTML += `

              <div class="card">

                <h3>${t.nome}</h3>

                <p>
                  <b>Sintoma:</b>
                  ${t.sintoma || "Não informado"}
                </p>

                <p>
                  <b>Temperatura:</b>
                  ${t.temperatura || "Não informada"}°C
                </p>

                <p>
                  <span class="${t.risco}">
                    ${t.risco}
                  </span>
                </p>

                <p>
                  <b>Alergia:</b>
                  ${t.alergia || "Nenhuma"}
                </p>

                <p>
                  <b>Observação:</b>
                  ${t.observacao || "Nenhuma"}
                </p>


                <div class="acoes-paciente">

                  <button
                    class="btn-atender"
                    onclick="selecionar(${index})">

                    🩺 Atender

                  </button>

                  <button
                    class="btn-tv"
                    onclick="chamarNaTV('${t.nome.replace(/'/g, "\\'")}')">

                    📺 Chamar na TV

                  </button>

                </div>

              </div>

            `;

          });

        })

        .catch(err => {

          console.error("Erro ao carregar triagens:", err);

        });

    }


    /* =========================================================
       CHAMAR PACIENTE NA TV
    ========================================================= */

    function chamarNaTV(nome) {

      const consultorio =
        document.getElementById("consultorio-num").value || "01";


      fetch("/tv/chamar", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          localTipo: "CONSULTÓRIO",

          localNumero: consultorio,

          paciente: nome

        })

      })

      .then(r => r.json())

      .then(() => {

        alert(
          "✅ " +
          nome +
          " foi chamado na TV para o Consultório " +
          consultorio +
          "!"
        );

      })

      .catch(err => {

        console.error(err);

        alert("❌ Não foi possível chamar o paciente na TV.");

      });

    }


    /* =========================================================
       SELECIONAR PACIENTE
    ========================================================= */

    function selecionar(index) {

      const t = triagensCarregadas[index];


      if (!t) {

        alert("Paciente não encontrado.");

        return;
      }


      document.getElementById("paciente").value =
        t.nome;


      document.getElementById("obs").value =
        t.observacao || "";


      if (
        t.alergia &&
        t.alergia !== "Nenhuma"
      ) {

        alert(
          "⚠️ Paciente possui alergia: " +
          t.alergia
        );

      }

    }


    /* =========================================================
       CARREGAR MEDICAÇÕES
    ========================================================= */

    function carregarMedicacoes() {

      fetch("/lista-medicacoes")

        .then(r => r.json())

        .then(data => {

          const select =
            document.getElementById("medicacao");


          select.innerHTML =
            `<option value="">
              Selecione a medicação
            </option>`;


          data.forEach(med => {

            const option =
              document.createElement("option");


            option.value = med;

            option.textContent = med;


            select.appendChild(option);

          });

        })

        .catch(err => {

          console.error(
            "Erro ao carregar medicações:",
            err
          );

        });

    }


    /* =========================================================
       SALVAR CONSULTA
    ========================================================= */

    function salvar() {

      const paciente =
        document.getElementById("paciente").value;

      const diagnostico =
        document.getElementById("diagnostico").value;

      const medicacao =
        document.getElementById("medicacao").value;

      const obs =
        document.getElementById("obs").value;


      if (!paciente) {

        alert(
          "⚠️ Selecione um paciente clicando em Atender."
        );

        return;
      }


      if (!diagnostico) {

        alert(
          "⚠️ Informe o diagnóstico."
        );

        return;
      }


      if (!medicacao) {

        alert(
          "⚠️ Selecione uma medicação."
        );

        return;
      }


      fetch("/consulta", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          paciente,
          diagnostico,
          medicacao,
          obs

        })

      })

      .then(r => {

        if (!r.ok) {
          throw new Error("Erro ao salvar consulta");
        }

        return r.json();

      })

      .then(() => {

        alert("✅ Consulta salva com sucesso!");

        limparConsulta();

      })

      .catch(err => {

        console.error(err);

        alert(
          "❌ Não foi possível salvar a consulta."
        );

      });

    }


    /* =========================================================
       LIMPAR CONSULTA
    ========================================================= */

    function limparConsulta() {

      document.getElementById("paciente").value =
        "";

      document.getElementById("diagnostico").value =
        "";

      document.getElementById("medicacao").value =
        "";

      document.getElementById("obs").value =
        "";

    }


    /* =========================================================
       INICIALIZAÇÃO
    ========================================================= */

    carregar();

    carregarMedicacoes();


    setInterval(
      carregar,
      10000
    );

  </script>

</body>
</html>
