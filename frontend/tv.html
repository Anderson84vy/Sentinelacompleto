<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Chamadas | Sistema Hospitalar</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      min-height: 100vh;

      overflow: hidden;

      background:
        radial-gradient(
          circle at top left,
          #163b68,
          transparent 40%
        ),
        linear-gradient(
          135deg,
          #071525,
          #0b2038
        );

      color: white;
    }


    /* =========================================
       ESTRUTURA PRINCIPAL
    ========================================= */

    .tv-container {

      width: 96vw;
      height: 94vh;

      margin: 3vh auto;

      display: grid;

      grid-template-columns:
        30% 70%;

      gap: 20px;
    }


    /* =========================================
       PAINEL ESQUERDO
    ========================================= */

    .left-panel {

      display: grid;

      grid-template-rows:
        42% 58%;

      gap: 20px;
    }


    /* =========================================
       PAINEL DIREITO
    ========================================= */

    .right-panel {

      display: grid;

      grid-template-rows:
        72% 28%;

      gap: 20px;
    }


    /* =========================================
       CARDS
    ========================================= */

    .box {

      position: relative;

      overflow: hidden;

      border-radius: 24px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.98),
          rgba(240,247,255,0.98)
        );

      border: 1px solid
        rgba(255,255,255,0.75);

      box-shadow:
        0 20px 50px
        rgba(0,0,0,0.25);

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;
    }


    /* brilho decorativo */

    .box::before {

      content: "";

      position: absolute;

      width: 180px;
      height: 180px;

      border-radius: 50%;

      background:
        rgba(37,99,235,0.07);

      top: -80px;
      right: -80px;
    }


    /* =========================================
       TÍTULOS
    ========================================= */

    .box-title {

      position: relative;

      color: #64748b;

      font-size: 2vw;

      font-weight: 800;

      letter-spacing: 2px;

      text-transform: uppercase;

      margin-bottom: 10px;
    }


    /* =========================================
       GUICHÊ / CONSULTÓRIO
    ========================================= */

    .local-box {

      border-top: 7px solid #2563eb;
    }


    .local-number {

      color: #2563eb;

      font-size: 9vw;

      font-weight: 900;

      line-height: 0.95;

      letter-spacing: -5px;
    }


    .local-type {

      margin-top: 12px;

      padding: 7px 18px;

      border-radius: 50px;

      background: #e8f1ff;

      color: #1d4ed8;

      font-size: 1.4vw;

      font-weight: 800;

      letter-spacing: 1px;
    }


    /* =========================================
       HISTÓRICO
    ========================================= */

    .history-box {

      justify-content: flex-start;

      align-items: stretch;

      padding: 28px;
    }


    .history-box .box-title {

      align-self: center;

      font-size: 1.4vw;

      margin-bottom: 20px;
    }


    #history-list {

      width: 100%;

      list-style: none;

      color: #1e293b;

      font-size: 1.25vw;

      font-weight: 700;

      text-align: left;
    }


    #history-list li {

      display: flex;

      align-items: center;

      gap: 10px;

      padding: 13px 5px;

      border-bottom:
        1px solid #e2e8f0;
    }


    #history-list li::before {

      content: "✓";

      display: flex;

      align-items: center;

      justify-content: center;

      width: 25px;
      height: 25px;

      border-radius: 50%;

      background: #e8f1ff;

      color: #2563eb;

      font-size: 13px;

      flex-shrink: 0;
    }


    /* =========================================
       CHAMADA DO PACIENTE
    ========================================= */

    .patient-box {

      border-top: 7px solid #0ea5e9;

      padding: 30px;
    }


    .patient-box .box-title {

      font-size: 2vw;

      color: #64748b;

      margin-bottom: 25px;
    }


    .patient-name {

      width: 95%;

      color: #0f172a;

      font-size: 6vw;

      font-weight: 900;

      line-height: 1.05;

      text-transform: uppercase;

      word-break: break-word;

      overflow-wrap: anywhere;
    }


    .patient-status {

      margin-top: 25px;

      padding: 10px 24px;

      border-radius: 50px;

      background: #dcfce7;

      color: #15803d;

      font-size: 1.1vw;

      font-weight: 800;

      letter-spacing: 1px;
    }


    /* =========================================
       LOGO / RODAPÉ
    ========================================= */

    .logo-box {

      flex-direction: row;

      justify-content: space-between;

      padding: 25px 40px;

      border-top: 7px solid #2563eb;
    }


    .logo-area {

      display: flex;

      align-items: center;

      gap: 15px;
    }


    .logo-icon {

      width: 65px;
      height: 65px;

      border-radius: 17px;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #0ea5e9
        );

      color: white;

      font-size: 38px;

      font-weight: 900;

      box-shadow:
        0 8px 20px
        rgba(37,99,235,0.25);
    }


    .logo-text {

      color: #172554;

      font-size: 2.2vw;

      font-weight: 900;

      letter-spacing: -1px;
    }


    /* =========================================
       RELÓGIO
    ========================================= */

    .clock-area {

      text-align: right;
    }


    #clock {

      color: #2563eb;

      font-size: 2vw;

      font-weight: 900;
    }


    #date {

      margin-top: 5px;

      color: #64748b;

      font-size: 0.95vw;
    }


    /* =========================================
       ONLINE
    ========================================= */

    .online {

      position: absolute;

      right: 25px;
      top: 20px;

      display: flex;

      align-items: center;

      gap: 7px;

      color: #16a34a;

      font-size: 0.85vw;

      font-weight: bold;
    }


    .online-dot {

      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #22c55e;

      box-shadow:
        0 0 10px
        rgba(34,197,94,0.8);

      animation:
        onlinePulse 2s infinite;
    }


    @keyframes onlinePulse {

      0%, 100% {
        opacity: 1;
      }

      50% {
        opacity: 0.35;
      }

    }


    /* =========================================
       ANIMAÇÃO DA NOVA CHAMADA
    ========================================= */

    @keyframes newCall {

      0% {

        transform: scale(1);

        box-shadow:
          0 20px 50px
          rgba(0,0,0,0.25);
      }

      35% {

        transform: scale(1.015);

        box-shadow:
          0 0 0 10px
          rgba(14,165,233,0.15),
          0 20px 60px
          rgba(14,165,233,0.35);
      }

      70% {

        transform: scale(1.01);
      }

      100% {

        transform: scale(1);

        box-shadow:
          0 20px 50px
          rgba(0,0,0,0.25);
      }
    }


    .new-call {

      animation:
        newCall 1.2s ease 3;
    }


    /* =========================================
       RESPONSIVIDADE
    ========================================= */

    @media (max-width: 1000px) {

      .tv-container {

        grid-template-columns: 1fr;

        height: auto;

        overflow-y: auto;
      }

      .left-panel,
      .right-panel {

        grid-template-rows: auto;

      }

      body {

        overflow: auto;
      }

      .local-number {

        font-size: 100px;
      }

      .patient-name {

        font-size: 60px;
      }

      .box-title {

        font-size: 20px;
      }

      #history-list {

        font-size: 16px;
      }

      .logo-text {

        font-size: 25px;
      }

      #clock {

        font-size: 22px;
      }

    }

  </style>

</head>


<body>


<div class="tv-container">


  <!-- =====================================
       ESQUERDA
  ====================================== -->

  <div class="left-panel">


    <!-- GUICHÊ / CONSULTÓRIO -->

    <div class="box local-box">

      <div class="online">

        <span class="online-dot"></span>

        SISTEMA ONLINE

      </div>

      <div class="box-title"
           id="local-tipo">

        GUICHÊ

      </div>


      <div class="local-number"
           id="local-numero">

        --

      </div>


      <div class="local-type">

        AGUARDE O ATENDIMENTO

      </div>

    </div>


    <!-- HISTÓRICO -->

    <div class="box history-box">

      <div class="box-title">

        ÚLTIMAS CHAMADAS

      </div>


      <ul id="history-list">

      </ul>

    </div>


  </div>



  <!-- =====================================
       DIREITA
  ====================================== -->

  <div class="right-panel">


    <!-- PACIENTE -->

    <div class="box patient-box"
         id="patient-box">


      <div class="box-title">

        CHAMADA ATUAL

      </div>


      <div class="patient-name"
           id="patient-name">

        AGUARDANDO...

      </div>


      <div class="patient-status">

        POR FAVOR, DIRIJA-SE AO LOCAL INDICADO

      </div>


    </div>



    <!-- LOGO -->

    <div class="box logo-box">


      <div class="logo-area">


        <div class="logo-icon">

          ✚

        </div>


        <div class="logo-text">

          SISTEMA HOSPITALAR

        </div>


      </div>


      <div class="clock-area">

        <div id="clock">

          --:--

        </div>

        <div id="date">

          --

        </div>

      </div>


    </div>


  </div>

</div>



<script>

let ultimoId = null;


/* =========================================
   ATUALIZAÇÃO DA TV
========================================= */

function atualizar() {

  fetch("/tv/chamada")

    .then(r => r.json())

    .then(data => {


      const chamada = data.chamada;

      const historico =
        data.historico || [];


      /* -----------------------------
         CHAMADA ATUAL
      ----------------------------- */

      if (chamada) {

        document.getElementById(
          "local-tipo"
        ).innerText =
          chamada.localTipo ||
          "GUICHÊ";


        document.getElementById(
          "local-numero"
        ).innerText =
          chamada.localNumero ||
          "--";


        document.getElementById(
          "patient-name"
        ).innerText =
          chamada.paciente ||
          "AGUARDANDO...";


        /* NOVA CHAMADA */

        if (chamada.id !== ultimoId) {

          ultimoId = chamada.id;


          const patientBox =
            document.getElementById(
              "patient-box"
            );


          patientBox.classList.remove(
            "new-call"
          );


          void patientBox.offsetWidth;


          patientBox.classList.add(
            "new-call"
          );

        }

      }


      /* -----------------------------
         HISTÓRICO
      ----------------------------- */

      const list =
        document.getElementById(
          "history-list"
        );


      list.innerHTML = "";


      historico
        .slice(0, 5)
        .forEach(h => {


          const li =
            document.createElement("li");


          const tipo =
            h.localTipo
              ? h.localTipo
                  .substring(0, 4)
                  .toUpperCase()
              : "GUIC";


          li.innerText =
            `${tipo}. ${h.localNumero} — ${h.paciente}`;


          list.appendChild(li);

        });

    })

    .catch(err => {

      console.log(
        "Erro ao buscar chamada:",
        err
      );

    });

}


/* =========================================
   RELÓGIO
========================================= */

function atualizarRelogio() {

  const agora = new Date();


  const hora =
    agora.toLocaleTimeString(
      "pt-BR",
      {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }
    );


  const data =
    agora.toLocaleDateString(
      "pt-BR",
      {
        weekday: "long",
        day: "2-digit",
        month: "long",
        year: "numeric"
      }
    );


  document.getElementById(
    "clock"
  ).innerText = hora;


  document.getElementById(
    "date"
  ).innerText =
    data.charAt(0).toUpperCase() +
    data.slice(1);

}


/* =========================================
   INICIALIZAÇÃO
========================================= */

atualizar();

atualizarRelogio();


/* Atualiza chamadas a cada 2 segundos */

setInterval(
  atualizar,
  2000
);


/* Atualiza relógio */

setInterval(
  atualizarRelogio,
  1000
);

</script>


</body>

</html>
