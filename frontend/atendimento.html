```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MEDCORE | Atendimento</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>

  <div class="container">

    <h2>Atendimento</h2>

    <p>Cadastro de paciente</p>


    <!-- =========================
         DADOS PESSOAIS
    ========================== -->

    <h3>Dados pessoais</h3>


    <!-- NOME COMPLETO -->

    <label for="nome">
      Nome completo
    </label>

    <input
      id="nome"
      type="text"
      placeholder="Digite o nome completo"
      autocomplete="name"
    >


    <!-- CPF -->

    <label for="cpf">
      CPF
    </label>

    <input
      id="cpf"
      type="text"
      placeholder="000.000.000-00"
      maxlength="14"
    >


    <!-- NOME DA MÃE -->

    <label for="mae">
      Nome da mãe
    </label>

    <input
      id="mae"
      type="text"
      placeholder="Digite o nome completo da mãe"
    >


    <!-- DATA DE NASCIMENTO -->

    <label for="nascimento">
      Data de nascimento
    </label>

    <input
      id="nascimento"
      type="date"
    >


    <!-- ESTADO CIVIL -->

    <label for="estadoCivil">
      Estado civil
    </label>

    <select id="estadoCivil">

      <option value="">
        Selecione
      </option>

      <option value="Solteiro(a)">
        Solteiro(a)
      </option>

      <option value="Casado(a)">
        Casado(a)
      </option>

      <option value="Divorciado(a)">
        Divorciado(a)
      </option>

      <option value="Viúvo(a)">
        Viúvo(a)
      </option>

      <option value="Separado(a)">
        Separado(a)
      </option>

      <option value="União estável">
        União estável
      </option>

    </select>


    <!-- =========================
         CONTATO
    ========================== -->

    <h3>Contato</h3>


    <!-- TELEFONE -->

    <label for="telefone">
      Telefone
    </label>

    <input
      id="telefone"
      type="tel"
      placeholder="(00) 00000-0000"
      autocomplete="tel"
    >


    <!-- EMAIL -->

    <label for="email">
      E-mail
    </label>

    <input
      id="email"
      type="email"
      placeholder="exemplo@email.com"
      autocomplete="email"
    >


    <!-- CONTATO DE EMERGÊNCIA -->

    <label for="emergencia">
      Contato de emergência
    </label>

    <input
      id="emergencia"
      type="tel"
      placeholder="Nome e telefone do contato"
    >


    <!-- =========================
         ENDEREÇO
    ========================== -->

    <h3>Endereço</h3>


    <label for="endereco">
      Endereço completo
    </label>

    <input
      id="endereco"
      type="text"
      placeholder="Rua, número, bairro, cidade e estado"
      autocomplete="street-address"
    >


    <!-- =========================
         ATENDIMENTO
    ========================== -->

    <h3>Informações do atendimento</h3>


    <!-- CONVÊNIO -->

    <label for="tipo">
      Convênio
    </label>

    <select id="tipo">

      <option value="">
        Selecione
      </option>

      <option value="Convenio">
        Convênio
      </option>

      <option value="Particular">
        Particular
      </option>

    </select>


    <!-- ARQUIVO -->

    <label for="foto">
      Documento / Foto
    </label>

    <input
      type="file"
      id="foto"
      accept="image/*,.pdf"
    >


    <!-- BOTÃO -->

    <button
      type="button"
      onclick="cadastrar()"
    >
      Cadastrar paciente
    </button>


  </div>


  <script>

    /*
    =====================================================
    CONFIGURAÇÃO DO SERVIDOR
    =====================================================

    LOCAL:
    http://localhost:3000

    RENDER:
    usa o mesmo endereço do site.
    */

    const API_URL =
      window.location.hostname === "localhost" ||
      window.location.hostname === "127.0.0.1"
        ? "http://localhost:3000"
        : "";


    /*
    =====================================================
    CADASTRAR PACIENTE
    =====================================================
    */

    async function cadastrar() {

      /*
      Pega os valores dos campos
      */

      const nome =
        document.getElementById("nome").value.trim();

      const cpf =
        document.getElementById("cpf").value.trim();

      const mae =
        document.getElementById("mae").value.trim();

      const nascimento =
        document.getElementById("nascimento").value;

      const estadoCivil =
        document.getElementById("estadoCivil").value;

      const telefone =
        document.getElementById("telefone").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const emergencia =
        document.getElementById("emergencia").value.trim();

      const endereco =
        document.getElementById("endereco").value.trim();

      const tipo =
        document.getElementById("tipo").value;


      /*
      =====================================================
      VALIDAÇÃO
      =====================================================
      */

      if (
        !nome ||
        !cpf ||
        !mae ||
        !nascimento ||
        !estadoCivil ||
        !telefone ||
        !emergencia ||
        !endereco ||
        !tipo
      ) {

        alert(
          "Preencha todos os campos obrigatórios."
        );

        return;

      }


      /*
      =====================================================
      OBJETO DO PACIENTE
      =====================================================
      */

      const paciente = {

        nome: nome,

        cpf: cpf,

        mae: mae,

        nascimento: nascimento,

        estadoCivil: estadoCivil,

        telefone: telefone,

        email: email,

        emergencia: emergencia,

        endereco: endereco,

        tipo: tipo

      };


      /*
      =====================================================
      ENVIA PARA O BACKEND
      =====================================================
      */

      try {

        const response =
          await fetch(
            `${API_URL}/atendimento`,
            {

              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify(paciente)

            }
          );


        /*
        Verifica se o servidor respondeu com erro
        */

        if (!response.ok) {

          throw new Error(
            `Erro HTTP: ${response.status}`
          );

        }


        const data =
          await response.json().catch(() => ({}));


        console.log(
          "Paciente cadastrado:",
          data
        );


        alert(
          "Paciente cadastrado com sucesso!\n\n" +
          "O paciente foi enviado para a triagem."
        );


        /*
        Limpa os campos depois do cadastro
        */

        document.getElementById("nome").value = "";

        document.getElementById("cpf").value = "";

        document.getElementById("mae").value = "";

        document.getElementById("nascimento").value = "";

        document.getElementById("estadoCivil").value = "";

        document.getElementById("telefone").value = "";

        document.getElementById("email").value = "";

        document.getElementById("emergencia").value = "";

        document.getElementById("endereco").value = "";

        document.getElementById("tipo").value = "";

        document.getElementById("foto").value = "";

      }


      catch (error) {

        console.error(
          "Erro ao cadastrar paciente:",
          error
        );


        alert(
          "Não foi possível cadastrar o paciente.\n\n" +
          "Verifique se o servidor está funcionando."
        );

      }

    }


    /*
    =====================================================
    MÁSCARA CPF
    =====================================================
    */

    document
      .getElementById("cpf")
      .addEventListener(
        "input",
        function () {

          let valor =
            this.value.replace(/\D/g, "");


          valor =
            valor.substring(0, 11);


          if (valor.length > 9) {

            valor =
              valor.replace(
                /(\d{3})(\d{3})(\d{3})(\d{1,2})/,
                "$1.$2.$3-$4"
              );

          }

          else if (valor.length > 6) {

            valor =
              valor.replace(
                /(\d{3})(\d{3})(\d{1,3})/,
                "$1.$2.$3"
              );

          }

          else if (valor.length > 3) {

            valor =
              valor.replace(
                /(\d{3})(\d{1,3})/,
                "$1.$2"
              );

          }


          this.value = valor;

        }
      );


    /*
    =====================================================
    MÁSCARA TELEFONE
    =====================================================
    */

    document
      .getElementById("telefone")
      .addEventListener(
        "input",
        function () {

          let valor =
            this.value.replace(/\D/g, "");


          valor =
            valor.substring(0, 11);


          if (valor.length > 10) {

            valor =
              valor.replace(
                /(\d{2})(\d{5})(\d{4})/,
                "($1) $2-$3"
              );

          }

          else if (valor.length > 6) {

            valor =
              valor.replace(
                /(\d{2})(\d{4})(\d{1,4})/,
                "($1) $2-$3"
              );

          }

          else if (valor.length > 2) {

            valor =
              valor.replace(
                /(\d{2})(\d{1,5})/,
                "($1) $2"
              );

          }


          this.value = valor;

        }
      );

  </script>

</body>

</html>
```
